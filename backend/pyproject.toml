# backend/pyproject.toml
# SocraticAI backend — uv-managed Python project
#
# After cloning, bootstrap the environment:
#   uv sync                  # installs all dependencies + creates .venv
#   uv run uvicorn app.main:app --reload
#
# uv.lock is auto-generated by `uv lock` — do NOT edit it manually.
# Commit uv.lock to version control for reproducible installs.

[project]
name = "socratic-ai-backend"
version = "0.1.0"
description = "SocraticAI — bilingual AI-powered debate training platform backend"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SocraticAI Team" }]

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",

    # ── Agent orchestration ────────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",

    # ── Google Gemini SDK ──────────────────────────────────────────────────────
    "google-genai>=1.0.0",

    # ── Vector store ───────────────────────────────────────────────────────────
    "qdrant-client[fastembed]>=1.11.0",
    "sentence-transformers>=3.0.0",

    # ── Cache & checkpointing ──────────────────────────────────────────────────
    "redis[hiredis]>=5.0.0",

    # ── Config & validation ────────────────────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",

    # ── Observability ─────────────────────────────────────────────────────────
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # async test client
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
]

[project.scripts]
# Convenience entry point: `uv run socratic-backend`
socratic-backend = "app.main:run"

# ─── uv ───────────────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
]

# ─── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]   # pycodestyle errors/warnings, pyflakes, isort
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # third-party stubs are incomplete
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "google.generativeai.*", "qdrant_client.*"]
ignore_missing_imports = true

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"

# ─── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
